<div class="cam-win">
  <div class="cam-toolbar">
    <label for="cam-select">Camera</label>
    <select id="cam-select"></select>
    <button type="button" id="cam-connect">Connect</button>
    <button type="button" id="cam-disconnect">Disconnect</button>
    <span id="cam-status">No camera connected</span>
  </div>
  <div class="cam-stage">
    <img id="cam-frame" alt="Camera frame">
    <div id="cam-empty">Connect a camera to see frames</div>
  </div>
</div>
